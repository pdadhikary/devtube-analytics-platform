[project]
name = "devtube-dagster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deepta", email = "deeptoadhikary@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.21",
    "dagster-dg-cli>=1.13.21",
    "dagster-postgres>=0.29.21",
    "dagster-webserver>=1.13.21",
    "devtube-pipeline",
    "psycopg2-binary>=2.9.13",
]


[tool.uv.sources]
devtube-pipeline = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.zuban]
python_executable = "../../.venv/bin/python"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "devtube_dagster"
