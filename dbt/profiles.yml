devtube:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../duckdb/devtube.duckdb
      threads: 4
      extensions:
        - httpfs
        - iceberg
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT_URL') }}"
        s3_url_style: path
        s3_region: "{{ env_var('AWS_DEFAULT_REGION') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
        s3_use_ssl: false
