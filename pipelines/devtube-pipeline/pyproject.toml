[project]
name = "devtube-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deepta", email = "deeptoadhikary@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.110",
    "httpx>=0.28.1",
    "httpx-retries>=0.6.0",
    "isodate>=0.7.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyiceberg>=0.12.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "types-boto3-s3>=1.43.106",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.ty.environment]
python = "../../.venv"

[tool.zuban]
python_executable = "../../.venv/bin/python"
