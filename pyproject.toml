[project]
name = "devtube-analytics-platform"
version = "0.1.0"
description = "Intelligent anlytics platform for the latest trends in the YouTube dev space."
readme = "README.md"
authors = [
    { name = "Deepta", email = "deeptoadhikary@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "common",
]

[tool.uv.sources]
common = { workspace = true }

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
    "pipelines/*",
    "orchestration/*",
    "rag/*",
]
exclude = ["apps/devtube_web"]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.89",
    "duckdb",
    "pgcli>=4.7.1",
    "psycopg[binary]>=3.3.5",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ty>=0.0.86",
    "zuban>=0.10.0",
]

[tool.ty.environment]
python = ".venv"

[tool.zuban]
python_executable = ".venv/bin/python"
