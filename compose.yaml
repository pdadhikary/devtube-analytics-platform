services:
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: always
    ports:
      - "4566:4566"
      - "6379-6399:6379-6399"
      - "7100-7199:7100-7199"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: devtube_network
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    networks:
      - devtube_network

  dagster_db:
    image: postgres:18-alpine
    container_name: dagster_db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - dagster-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ:-UTC}
    networks:
      - devtube_network

volumes:
  floci-data:
  dagster-data:

networks:
  devtube_network:
    name: devtube_network
