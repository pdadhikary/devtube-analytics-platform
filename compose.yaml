services:
  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - ./rustfs:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: always
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./rustfs/data:/data
      - ./rustfs/logs/:/var/log/rustfs/
    environment:
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
      - RUSTFS_OBS_LOG_DIRECTORY=/var/log/rustfs/
      - RUSTFS_ACCESS_KEY=${AWS_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${AWS_SECRET_ACCESS_KEY}
      - RUSTFS_REGION=${AWS_DEFAULT_REGION}
    networks:
      - devtube_network

  dagster_db:
    image: postgres:18-alpine
    container_name: dagster_db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - dagster-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ:-UTC}
    networks:
      - devtube_network

volumes:
  dagster-data:

networks:
  devtube_network:
    name: devtube_network
